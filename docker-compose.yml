services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnicalc
      POSTGRES_USER: omnicalc
      POSTGRES_PASSWORD: omnicalc
    ports:
      - "5432:5432"
    volumes:
      - omnicalc_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/002_calcgraph.sql:/docker-entrypoint-initdb.d/002-calcgraph.sql:ro
      - ./database/003_auth.sql:/docker-entrypoint-initdb.d/003-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicalc -d omnicalc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://omnicalc:omnicalc@database:5432/omnicalc
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-omnicalc-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-omnicalc-web}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  omnicalc_data:
