services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnicalc
      POSTGRES_USER: omnicalc
      POSTGRES_PASSWORD: omnicalc
    ports:
      - "5432:5432"
    volumes:
      - omnicalc_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicalc -d omnicalc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://omnicalc:omnicalc@database:5432/omnicalc
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  omnicalc_data:

